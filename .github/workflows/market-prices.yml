name: PEZA market prices

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Zambia market prices
        env:
          PEZA_SHOP_URL: https://shop.peza.africa
          PEZA_MARKET_CRON_SECRET: ${{ secrets.PEZA_MARKET_CRON_SECRET }}
        run: |
          test -n "$PEZA_MARKET_CRON_SECRET"
          curl --fail --silent --show-error \
            -H "x-peza-cron-secret: $PEZA_MARKET_CRON_SECRET" \
            "$PEZA_SHOP_URL/api/market-prices/sync"
